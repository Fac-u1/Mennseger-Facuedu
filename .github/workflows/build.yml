name: Build Multiplataforma (Android, iOS & Desktop)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Forzar jobs de escritorio (.exe, .dmg/.pkg, .deb/.AppImage) si aún no se detecta :desktop'
        required: false
        type: boolean
        default: false
      build_ios:
        description: 'Forzar job de iOS (.ipa) si aún no se detecta proyecto Xcode'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_VERSION: '9.3.1'
  JAVA_VERSION: '21'
  APP_NAME: 'Facuedu.uy Mennseger'
  APP_SLUG: 'facuedu-uy-mennseger'

jobs:
  detect:
    name: Detectar módulos disponibles
    runs-on: ubuntu-latest
    outputs:
      has_desktop: ${{ steps.check.outputs.has_desktop }}
      has_ios: ${{ steps.check.outputs.has_ios }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Verificar existencia de módulos :desktop e iOS
        id: check
        run: |
          if [ -f "desktop/build.gradle.kts" ] || [ -f "desktop/build.gradle" ]; then
            echo "has_desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_desktop=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No se encontró el módulo ':desktop' todavía. El build de Android (.apk) se ejecutará normalmente; los builds de escritorio requieren el target ':desktop' (Compose Multiplatform / JVM)."
          fi

          if compgen -G "iosApp/*.xcodeproj" > /dev/null || compgen -G "iosApp/*.xcworkspace" > /dev/null || compgen -G "ios/*.xcodeproj" > /dev/null || compgen -G "ios/*.xcworkspace" > /dev/null; then
            echo "has_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ios=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No se encontró proyecto Xcode en iosApp/ o ios/ todavía. El build de iOS (.ipa) se activará automáticamente al agregarlo."
          fi

  android-apk:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Preparar .env si no existe
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Ejecutar pruebas unitarias y compilar APK Debug
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Subir artefacto Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-ios:
    name: iOS (.ipa)
    needs: detect
    if: ${{ needs.detect.outputs.has_ios == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_ios == true) }}
    runs-on: macos-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Compilar framework compartido KMP si existe (:shared)
        run: |
          if [ -f "shared/build.gradle.kts" ] || [ -f "shared/build.gradle" ]; then
            gradle :shared:embedAndSignAppleFrameworkForXcode --no-daemon || gradle :shared:linkReleaseFrameworkIosArm64 --no-daemon
          fi

      - name: Archivar y empaquetar iOS (.ipa)
        run: |
          set -euo pipefail
          IOS_DIR=""
          for candidate in iosApp ios; do
            if [ -d "$candidate" ]; then
              IOS_DIR="$candidate"
              break
            fi
          done
          if [ -z "$IOS_DIR" ]; then
            echo "No se encontró el directorio iosApp/ o ios/."
            exit 1
          fi

          WORKSPACE=$(find "$IOS_DIR" -maxdepth 2 -name "*.xcworkspace" | head -n 1 || true)
          PROJECT=$(find "$IOS_DIR" -maxdepth 2 -name "*.xcodeproj" | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
            BUILD_TARGET=(-workspace "$WORKSPACE" -scheme "$SCHEME")
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -project "$PROJECT" -json | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
            BUILD_TARGET=(-project "$PROJECT" -scheme "$SCHEME")
          else
            echo "No se encontró archivo .xcworkspace ni .xcodeproj en $IOS_DIR."
            exit 1
          fi

          mkdir -p build-ios dist-ios
          ARCHIVE_PATH="build-ios/FacueduMennseger.xcarchive"

          xcodebuild archive \
            "${BUILD_TARGET[@]}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          if [ -f "$IOS_DIR/ExportOptions.plist" ]; then
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportOptionsPlist "$IOS_DIR/ExportOptions.plist" \
              -exportPath dist-ios
          else
            APP_BUNDLE=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
            if [ -z "$APP_BUNDLE" ]; then
              echo "No se encontró el paquete .app dentro de $ARCHIVE_PATH."
              exit 1
            fi
            rm -rf build-ios/Payload
            mkdir -p build-ios/Payload
            cp -R "$APP_BUNDLE" build-ios/Payload/
            (cd build-ios && zip -qry "../dist-ios/Facuedu.uy-Mennseger-iOS.ipa" Payload)
          fi

      - name: Subir artefacto iOS (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-ios-ipa
          path: dist-ios/*.ipa
          if-no-files-found: error

  build-windows:
    name: Windows (.exe)
    needs: detect
    if: ${{ needs.detect.outputs.has_desktop == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_desktop == true) }}
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Asegurar WiX Toolset para empaquetado .exe
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y
          }

      - name: Compilar instalador Windows (.exe)
        shell: pwsh
        run: gradle :desktop:packageExe --no-daemon

      - name: Subir artefacto Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-windows-exe
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: error

  build-macos:
    name: macOS (.dmg y .pkg)
    needs: detect
    if: ${{ needs.detect.outputs.has_desktop == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_desktop == true) }}
    runs-on: macos-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Compilar paquetes macOS (.dmg y .pkg)
        run: gradle :desktop:packageDmg :desktop:packagePkg --no-daemon

      - name: Subir artefactos macOS (.dmg y .pkg)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-macos-dmg-pkg
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/pkg/*.pkg
            desktop/build/compose/binaries/main-release/dmg/*.dmg
            desktop/build/compose/binaries/main-release/pkg/*.pkg
          if-no-files-found: error

  build-linux-ubuntu:
    name: Linux & Ubuntu (.deb y .AppImage)
    needs: detect
    if: ${{ needs.detect.outputs.has_desktop == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_desktop == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Instalar dependencias de empaquetado Linux/Ubuntu (.deb y AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            dpkg-dev \
            binutils \
            libfuse2 \
            squashfs-tools \
            desktop-file-utils \
            webp

      - name: Compilar paquete Debian/Ubuntu (.deb) y binario distribuible
        run: gradle :desktop:packageDeb :desktop:createDistributable --no-daemon

      - name: Construir .AppImage para Linux y Ubuntu
        run: |
          set -euo pipefail
          DIST_DIR=$(find desktop/build/compose/binaries -type d -path "*/app/*" | head -n 1)
          if [ -z "$DIST_DIR" ]; then
            echo "No se encontró el directorio distributable de Compose Desktop."
            exit 1
          fi

          rm -rf AppDir
          mkdir -p AppDir/usr
          cp -r "$DIST_DIR"/* AppDir/usr/

          EXEC_PATH=$(find AppDir/usr/bin -maxdepth 1 -type f -executable | head -n 1)
          if [ -z "$EXEC_PATH" ]; then
            echo "No se encontró el ejecutable dentro de AppDir/usr/bin."
            exit 1
          fi
          EXEC_REL=${EXEC_PATH#AppDir/}
          EXEC_NAME=$(basename "$EXEC_PATH")

          cat > AppDir/AppRun <<EOF
          #!/usr/bin/env bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\$HERE/$EXEC_REL" "\$@"
          EOF
          chmod +x AppDir/AppRun

          cat > "AppDir/${{ env.APP_SLUG }}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${{ env.APP_NAME }}
          Exec=$EXEC_NAME
          Icon=${{ env.APP_SLUG }}
          Categories=Network;InstantMessaging;
          Terminal=false
          EOF

          if [ -f "app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp" ]; then
            dwebp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp -o "AppDir/${{ env.APP_SLUG }}.png"
          elif [ -f "desktop/src/main/resources/icon.png" ]; then
            cp desktop/src/main/resources/icon.png "AppDir/${{ env.APP_SLUG }}.png"
          fi

          curl -fsSL -o appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p dist-linux
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AppDir "dist-linux/Facuedu.uy-Mennseger-x86_64.AppImage"

      - name: Subir artefactos Linux y Ubuntu (.deb y .AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-linux-deb-appimage
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main-release/deb/*.deb
            dist-linux/*.AppImage
          if-no-files-found: error

  release:
    name: Publicar GitHub Release
    needs: [android-apk, build-ios, build-windows, build-macos, build-linux-ubuntu]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.android-apk.result == 'success' || needs.build-ios.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux-ubuntu.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Crear GitHub Release con instaladores
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/*.apk
            release-assets/*.ipa
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.pkg
            release-assets/*.deb
            release-assets/*.AppImage
