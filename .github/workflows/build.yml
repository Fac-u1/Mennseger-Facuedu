name: Build Multiplataforma (Android, iOS & Desktop)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: '9.3.1'
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  android-apk:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restaurar debug.keystore para firma debugConfig
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Configurar Firebase google-services.json (si existe secreto) y .env
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ] && [ ! -f "app/google-services.json" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Ejecutar pruebas unitarias y compilar APK Debug
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Subir artefacto Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-ios:
    name: iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen si es necesario
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generar proyecto Xcode y compilar archivo .ipa
        run: |
          set -euo pipefail
          cd iosApp
          xcodegen generate

          mkdir -p ../build-ios ../dist-ios
          ARCHIVE_PATH="../build-ios/FacueduMennseger.xcarchive"

          xcodebuild archive \
            -project FacueduMennseger.xcodeproj \
            -scheme FacueduMennseger \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          if [ -f "ExportOptions.plist" ]; then
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportOptionsPlist "ExportOptions.plist" \
              -exportPath "../dist-ios"
          else
            APP_BUNDLE=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
            if [ -z "$APP_BUNDLE" ]; then
              echo "No se encontró el paquete .app dentro de $ARCHIVE_PATH."
              exit 1
            fi
            rm -rf ../build-ios/Payload
            mkdir -p ../build-ios/Payload
            cp -R "$APP_BUNDLE" ../build-ios/Payload/
            (cd ../build-ios && zip -qry "../dist-ios/Facuedu.uy-Mennseger-iOS.ipa" Payload)
          fi

      - name: Subir artefacto iOS (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-ios-ipa
          path: dist-ios/*.ipa
          if-no-files-found: error

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias de escritorio
        working-directory: desktop-client
        run: npm install --no-audit --no-fund

      - name: Compilar instalador Windows (.exe)
        working-directory: desktop-client
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Subir artefacto Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-windows-exe
          path: desktop-client/dist/*.exe
          if-no-files-found: error

  build-macos:
    name: macOS (.dmg y .pkg)
    runs-on: macos-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias de escritorio
        working-directory: desktop-client
        run: npm install --no-audit --no-fund

      - name: Compilar paquetes macOS (.dmg y .pkg)
        working-directory: desktop-client
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Subir artefactos macOS (.dmg y .pkg)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-macos-dmg-pkg
          path: |
            desktop-client/dist/*.dmg
            desktop-client/dist/*.pkg
          if-no-files-found: error

  build-linux-ubuntu:
    name: Linux & Ubuntu (.deb y .AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar utilidades Linux/Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg desktop-file-utils
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Instalar dependencias de escritorio
        working-directory: desktop-client
        run: npm install --no-audit --no-fund

      - name: Compilar paquetes Linux y Ubuntu (.AppImage y .deb)
        working-directory: desktop-client
        run: npm run dist:linux

      - name: Subir artefactos Linux y Ubuntu (.deb y .AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-mennseger-linux-deb-appimage
          path: |
            desktop-client/dist/*.deb
            desktop-client/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publicar GitHub Release
    needs: [android-apk, build-ios, build-windows, build-macos, build-linux-ubuntu]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Crear GitHub Release con todos los instaladores
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/*.apk
            release-assets/*.ipa
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.pkg
            release-assets/*.deb
            release-assets/*.AppImage
